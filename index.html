<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%236aa5ff' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'%3E%3Cpath d='M16 3 4 9.5v13L16 29l12-6.5v-13zM4 9.5 16 16l12-6.5M16 16v13'/%3E%3C/svg%3E">
<meta name="theme-color" content="#171a21">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open 3D Library</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<header id="hLib">
  <h1>Open 3D Library</h1>
  <span id="chips"></span>
  <button id="bOpenLib" title="Open files or a folder (O)">Open…</button>
  <input id="q" placeholder="Search…  ( / )" style="width:200px">
  <label class="sp" style="color:var(--dim)">size <input id="cw" type="range" min="140" max="360" value="200" style="padding:0;vertical-align:middle"></label>
  <span id="status"></span>
</header>
<header id="hView" hidden>
  <button id="bBack" title="Esc">← Library</button>
  <button id="bOpen" title="Open files or a folder (O)">Open…</button>
  <button id="bPrev" title="[">‹</button><button id="bNext" title="]">›</button>
  <span id="title"></span>
  <select id="fsel" hidden></select>
  <button id="bReset" title="Reset view (R)">Reset</button>
  <button id="bIn">＋</button><button id="bOut">－</button>
  <button id="bRot" title="Auto-rotate">Rotate</button>
  <button id="bWire" title="Wireframe (W)">Wire</button>
  <button id="bClay" title="Plain clay material (C)">Clay</button>
  <button id="bGrid" class="on" title="Grid (G)">Grid</button>
  <button id="bBox" title="Bounding box (B)">Box</button>
  <button id="bSkel" hidden title="Show skeleton (K)">Bones</button>
  <button id="bScene" title="Scenery backdrop (E)">Scene</button>
  <select id="bg"><option value="#14161a">Dark</option><option value="#4a4f5a">Grey</option><option value="#e9ebef">Light</option></select>
  <button id="bShot" title="Save PNG">Shot</button>
  <button id="bInsp" class="on" title="Inspector (I)">Inspect</button>
</header>

<div id="notice" role="status" hidden><span></span><button id="nClose" title="Dismiss this message">Dismiss</button></div>
<div id="lib"></div>

<div id="viewer" hidden>
  <div id="center">
    <div id="stage"><div id="back" hidden><iframe id="ssi" title="shan-shui-inf generator"></iframe><div id="lys"></div><div id="wash"></div><div id="paper"></div></div><div id="fore" hidden></div><div id="scenePanel" hidden></div><div id="msg"></div><div id="err" role="alert" hidden><div class="panel"><h2>Couldn't open this file</h2><p id="errMsg"></p><code id="errFile"></code><div class="btns"><button id="eBack" class="primary">Back to library</button><button id="eOpen">Open another file…</button></div></div></div><div id="load" role="status" hidden><div class="panel"><h2 id="loadT">Loading…</h2><progress id="loadP" max="100" aria-label="Loading progress"></progress><span class="pct" id="loadPct" aria-hidden="true"></span></div></div><canvas id="viz" width="1200" height="120" hidden></canvas>
      <div id="hint">drag = rotate · right-drag / shift-drag = move · wheel = zoom · click = pick mesh · double-click = focus</div></div>
    <div id="gallery"></div>
    <div id="tr" hidden>
      <button id="tPlay" title="Space">▶</button><button id="tStop" title="Rewind">⏮</button>
      <input id="seek" type="range" min="0" max="1000" value="0"><span id="time">0:00 / 0:00</span>
      <select id="tSpeed" title="Speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option></select>
      <button id="tLoop" class="on" title="Loop">Loop</button>
      <select id="tClip" hidden title="Animation clip"></select>
      <span id="volw" style="color:var(--dim)">vol <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8"></span>
    </div>
  </div>
  <aside id="insp"><div id="inspBody"></div></aside>
</div>
<div id="lb"><img alt=""></div>
<dialog id="gate" aria-labelledby="gT"><div class="panel"><h2 id="gT">18+ content</h2><p>This item may contain nudity.<br>Are you 18 or older?</p><div class="btns"><button id="gYes" class="primary">Yes, I'm 18+</button><button id="gNo">No, go back</button></div></div></dialog>

<input id="fileIn" type="file" multiple hidden accept=".glb,.gltf,.bin,.fbx,.obj,.mtl,.vmd,.wav,.mp3,.ogg,.png,.jpg,.jpeg,.webp,.gif,.bmp,.tga">
<div id="drop" role="presentation" hidden>Drop files or a folder to open</div>

<script type="module" src="/src/app.js"></script>
</body>
</html>
