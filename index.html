<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%236aa5ff' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'%3E%3Cpath d='M16 3 4 9.5v13L16 29l12-6.5v-13zM4 9.5 16 16l12-6.5M16 16v13'/%3E%3C/svg%3E">
<meta name="theme-color" content="#171a21">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open 3D Library</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-cube" viewBox="0 0 16 16"><path d="M8 1.5 2.5 4.5v7L8 14.5l5.5-3v-7zM2.5 4.5 8 7.5l5.5-3M8 7.5v7"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></symbol>
  <symbol id="i-grid" viewBox="0 0 16 16"><path d="M2.5 2.5h4.5v4.5H2.5zM9 2.5h4.5v4.5H9zM2.5 9h4.5v4.5H2.5zM9 9h4.5v4.5H9z"/></symbol>
  <symbol id="i-list" viewBox="0 0 16 16"><path d="M5 4h9M5 8h9M5 12h9M2 4h.5M2 8h.5M2 12h.5"/></symbol>
  <symbol id="i-open" viewBox="0 0 16 16"><path d="M2 4h4l1.5 1.5H14V12.5H2z"/></symbol>
  <symbol id="i-back" viewBox="0 0 16 16"><path d="M13 8H3M7 4 3 8l4 4"/></symbol>
  <symbol id="i-prev" viewBox="0 0 16 16"><path d="m10 3-5 5 5 5"/></symbol>
  <symbol id="i-next" viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></symbol>
  <symbol id="i-reset" viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 1.6-3.7M3 2.5v3h3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
  <symbol id="i-minus" viewBox="0 0 16 16"><path d="M3 8h10"/></symbol>
  <symbol id="i-rotate" viewBox="0 0 16 16"><path d="M13 8a5 5 0 0 1-9 3M3 8a5 5 0 0 1 9-3M12 2v3H9M4 14v-3h3"/></symbol>
  <symbol id="i-layers" viewBox="0 0 16 16"><path d="m8 2-6 3.5L8 9l6-3.5zM2 8.5 8 12l6-3.5"/></symbol>
  <symbol id="i-scene" viewBox="0 0 16 16"><path d="m2 13 4-6 3 4 2-3 3 5z"/><circle cx="11.5" cy="4" r="1.5"/></symbol>
  <symbol id="i-shot" viewBox="0 0 16 16"><path d="M2 5h2.5L6 3.5h4L11.5 5H14v8H2z"/><circle cx="8" cy="8.7" r="2.3"/></symbol>
  <symbol id="i-panel" viewBox="0 0 16 16"><path d="M2 3h12v10H2zM10 3v10"/></symbol>
  <symbol id="i-more" viewBox="0 0 16 16"><circle cx="3.5" cy="8" r="1.2" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/><circle cx="12.5" cy="8" r="1.2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-close" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></symbol>
  <symbol id="i-up" viewBox="0 0 16 16"><path d="m4 10 4-4 4 4"/></symbol>
  <symbol id="i-play" viewBox="0 0 16 16"><path d="M5 3.5v9l7.5-4.5z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 16 16"><path d="M5.5 3.5v9M10.5 3.5v9" stroke-width="2.2"/></symbol>
  <symbol id="i-rewind" viewBox="0 0 16 16"><path d="M4 3.5v9M12.5 3.5 6 8l6.5 4.5z" fill="currentColor"/></symbol>
</svg>
<header id="hLib">
  <div class="brand"><svg class="i logo"><use href="#i-cube"/></svg><h1>Open 3D Library</h1></div>
  <div class="search"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" aria-label="Search assets" aria-keyshortcuts="/" placeholder="Search…  ( / )"></div>
  <span id="status" role="status"></span>
  <label id="cwl" class="size">Size <input id="cw" type="range" min="140" max="360" value="200"></label>
  <div class="seg" role="radiogroup" aria-label="Library layout">
    <label title="Grid view"><input type="radio" name="lay" value="grid" checked><span><svg class="i"><use href="#i-grid"/></svg><span class="sr">Grid</span></span></label>
    <label title="List view"><input type="radio" name="lay" value="list"><span><svg class="i"><use href="#i-list"/></svg><span class="sr">List</span></span></label>
  </div>
  <button id="bOpenLib" title="Open files or a folder (O)"><svg class="i"><use href="#i-open"/></svg>Open…</button>
  <div class="bar"><div id="chips" role="group" aria-label="Filter by type"></div>
    <label class="sort"><span>Sort</span> <select id="sort" aria-label="Sort by"><option value="name">Name</option><option value="type">Type</option><option value="size">Size (largest first)</option></select></label></div>
</header>
<header id="hView" hidden>
  <div class="tz tl">
    <button id="bBack" class="ghost" title="Back to library (Esc)" aria-label="Back to library"><svg class="i"><use href="#i-back"/></svg><span class="lbl">Library</span></button>
    <button id="bPrev" class="ghost icon" title="Previous asset ([)" aria-label="Previous asset"><svg class="i"><use href="#i-prev"/></svg></button><button id="bNext" class="ghost icon" title="Next asset (])" aria-label="Next asset"><svg class="i"><use href="#i-next"/></svg></button>
    <h1 id="title"></h1>
    <select id="fsel" hidden aria-label="Model file"></select>
  </div>
  <div class="tz tc">
    <div class="seg" role="radiogroup" aria-label="Display mode">
      <label title="Shaded: original materials"><input type="radio" name="mode" value="shaded" data-3d checked><span>Shaded</span></label>
      <label title="Clay: plain material (C)"><input type="radio" name="mode" value="clay" data-3d><span>Clay</span></label>
      <label title="Wireframe (W)"><input type="radio" name="mode" value="wire" data-3d><span>Wireframe</span></label>
    </div>
    <button id="bReset" class="ghost" data-3d title="Reset view (R)" aria-label="Reset view"><svg class="i"><use href="#i-reset"/></svg><span class="lbl">Reset</span></button>
    <button id="bOut" class="ghost icon" data-3d title="Zoom out" aria-label="Zoom out"><svg class="i"><use href="#i-minus"/></svg></button><button id="bIn" class="ghost icon" data-3d title="Zoom in" aria-label="Zoom in"><svg class="i"><use href="#i-plus"/></svg></button>
    <button id="bRot" class="ghost" data-3d aria-pressed="false" title="Auto-rotate (Space when there is no animation)" aria-label="Auto-rotate"><svg class="i"><use href="#i-rotate"/></svg><span class="lbl">Rotate</span></button>
  </div>
  <div class="tz tr">
    <button id="bMore" class="ghost icon" aria-expanded="false" aria-controls="more" title="More tools" aria-label="More tools"><svg class="i"><use href="#i-more"/></svg></button>
    <div id="more">
      <div class="pw">
        <button id="bOv" class="ghost" data-3d aria-expanded="false" aria-controls="ovMenu" title="Overlays: grid, bounding box, bones" aria-label="Overlays"><svg class="i"><use href="#i-layers"/></svg><span class="lbl">Overlays</span></button>
        <div id="ovMenu" class="menu" role="group" aria-label="Overlays">
          <span class="mh" aria-hidden="true">Overlays</span>
          <label><input type="checkbox" id="oGrid" data-3d checked> Grid <kbd aria-hidden="true">G</kbd></label>
          <label><input type="checkbox" id="oBox" data-3d> Bounding box <kbd aria-hidden="true">B</kbd></label>
          <label><input type="checkbox" id="oSkel" disabled> Bones <small id="skelWhy"></small><kbd aria-hidden="true">K</kbd></label>
        </div>
      </div>
      <button id="bScene" class="ghost" aria-expanded="false" aria-controls="scenePanel" title="Environment and scenery (E)" aria-label="Scene"><svg class="i"><use href="#i-scene"/></svg><span class="lbl">Scene</span></button>
      <select id="bg" data-3d aria-label="Background colour" title="Background colour"><option value="#14161a">Dark</option><option value="#4a4f5a">Grey</option><option value="#e9ebef">Light</option></select>
      <button id="bShot" class="ghost" data-3d title="Save screenshot as PNG" aria-label="Screenshot"><svg class="i"><use href="#i-shot"/></svg><span class="lbl">Shot</span></button>
      <button id="bOpen" class="ghost" title="Open files or a folder (O)" aria-label="Open files"><svg class="i"><use href="#i-open"/></svg><span class="lbl">Open…</span></button>
      <button id="bInsp" class="ghost" aria-pressed="true" aria-controls="insp" title="Inspector (I)" aria-label="Inspector"><svg class="i"><use href="#i-panel"/></svg><span class="lbl">Inspector</span></button>
    </div>
  </div>
</header>

<div id="notice" role="status" hidden><span></span><button id="nClose" title="Dismiss this message">Dismiss</button></div>
<main id="lib"></main>

<main id="viewer" hidden>
  <div id="center">
    <div id="stage"><div id="back" hidden><iframe id="ssi" title="shan-shui-inf generator"></iframe><div id="lys"></div><div id="wash"></div><div id="paper"></div></div><div id="fore" hidden></div><div id="scenePanel" role="region" aria-label="Scene settings" hidden></div><div id="msg"></div><div id="err" role="alert" hidden><div class="panel"><h2>Couldn't open this file</h2><p id="errMsg"></p><code id="errFile"></code><div class="btns"><button id="eBack" class="primary">Back to library</button><button id="eOpen">Open another file…</button></div></div></div><div id="load" role="status" hidden><div class="panel"><h2 id="loadT">Loading…</h2><progress id="loadP" max="100" aria-label="Loading progress"></progress><span class="pct" id="loadPct" aria-hidden="true"></span></div></div><canvas id="viz" width="1200" height="120" hidden></canvas>
      <button id="bDet" aria-controls="insp" title="Show asset details (I)"><svg class="i"><use href="#i-up"/></svg>Details</button>
      <div id="hint">drag = rotate · right-drag / shift-drag = move · wheel = zoom · click = pick mesh · double-click = focus</div></div>
    <div id="gallery"></div>
    <div id="tr" role="group" aria-label="Animation controls" hidden>
      <button id="tPlay" class="icon" title="Play (Space)" aria-label="Play"><svg class="i"><use href="#i-play"/></svg></button><button id="tStop" class="icon" title="Rewind to start" aria-label="Rewind to start"><svg class="i"><use href="#i-rewind"/></svg></button>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="time">0:00 / 0:00</span>
      <select id="tSpeed" title="Playback speed" aria-label="Playback speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
      <button id="tLoop" aria-pressed="true" title="Loop">Loop</button>
      <select id="tClip" hidden title="Animation clip" aria-label="Animation clip"></select>
      <label id="volw" class="muted">Volume <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8"></label>
    </div>
  </div>
  <aside id="insp" aria-label="Inspector"><div class="sheet-h"><b>Details</b><button id="bDetX" class="ghost icon" title="Close details" aria-label="Close details"><svg class="i"><use href="#i-close"/></svg></button></div><div id="inspBody"></div></aside>
</main>
<div id="lb" role="dialog" aria-modal="true" aria-label="Image viewer (Esc to close)" tabindex="-1"><img alt=""></div>
<dialog id="gate" aria-labelledby="gT"><div class="panel"><h2 id="gT">18+ content</h2><p>This item may contain nudity.<br>Are you 18 or older?</p><div class="btns"><button id="gYes" class="primary">Yes, I'm 18+</button><button id="gNo">No, go back</button></div></div></dialog>

<input id="fileIn" type="file" multiple hidden accept=".glb,.gltf,.bin,.fbx,.obj,.mtl,.vmd,.wav,.mp3,.ogg,.png,.jpg,.jpeg,.webp,.gif,.bmp,.tga">
<div id="drop" role="presentation" hidden>Drop files or a folder to open</div>

<script type="module" src="/src/app.js"></script>
</body>
</html>
